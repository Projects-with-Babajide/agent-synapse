name: Publish to npm

# Publishes via npm Trusted Publishing (OIDC). No npm token is stored anywhere:
# the workflow exchanges a short-lived GitHub OIDC token for publish rights, and
# npm attaches a verifiable provenance attestation automatically.
#
# Triggers on a published GitHub Release (recommended), or manual dispatch.
# The published version is whatever is in package.json on the checked-out ref,
# so cut the release from a commit that already has the version bumped.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout
      id-token: write     # required for OIDC trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1; Node 22 ships an older npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (provenance is automatic under OIDC)
        run: npm publish
