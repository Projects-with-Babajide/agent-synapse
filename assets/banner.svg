<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="auto">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&amp;display=swap');
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="brokerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="brokerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="p1" d="M 222 136 L 404 218"/>
    <path id="p2" d="M 678 136 L 496 218"/>
    <path id="p3" d="M 222 322 L 404 242"/>
    <path id="p4" d="M 678 322 L 496 242"/>
    <path id="p1r" d="M 404 218 L 222 136"/>
    <path id="p2r" d="M 496 218 L 678 136"/>
  </defs>

  <!-- Background -->
  <rect width="900" height="460" fill="url(#bg)" rx="0"/>

  <!-- Dot grid -->
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.9" fill="#ffffff" opacity="0.06"/>
  </pattern>
  <rect width="900" height="460" fill="url(#dots)"/>

  <!-- Connection lines -->
  <line x1="222" y1="136" x2="404" y2="218" stroke="#7c3aed" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,4"/>
  <line x1="678" y1="136" x2="496" y2="218" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,4"/>
  <line x1="222" y1="322" x2="404" y2="242" stroke="#3fb950" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,4"/>
  <line x1="678" y1="322" x2="496" y2="242" stroke="#f0883e" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,4"/>

  <!-- Animated dots -->
  <circle r="4.5" fill="#a78bfa">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle r="4.5" fill="#38bdf8">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.7s"><mpath href="#p2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" begin="0.7s"/>
  </circle>
  <circle r="4.5" fill="#4ade80">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.4s"><mpath href="#p3"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" begin="1.4s"/>
  </circle>
  <circle r="4.5" fill="#fb923c">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.9s"><mpath href="#p4"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" begin="1.9s"/>
  </circle>
  <circle r="3.5" fill="#a78bfa">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.1s"><mpath href="#p1r"/></animateMotion>
    <animate attributeName="opacity" values="0;0.75;0.75;0" dur="2.2s" repeatCount="indefinite" begin="1.1s"/>
  </circle>
  <circle r="3.5" fill="#38bdf8">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.8s"><mpath href="#p2r"/></animateMotion>
    <animate attributeName="opacity" values="0;0.75;0.75;0" dur="2.2s" repeatCount="indefinite" begin="1.8s"/>
  </circle>

  <!-- Broker -->
  <rect x="346" y="196" width="208" height="68" rx="34" fill="url(#brokerGrad)" filter="url(#brokerGlow)"/>
  <rect x="346" y="196" width="208" height="68" rx="34" fill="none" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
  <text x="450" y="228" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#ffffff">⚡ broker</text>
  <text x="450" y="248" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="rgba(255,255,255,0.5)">localhost:3117 · auto-started</text>
  <circle cx="450" cy="230" r="46" fill="none" stroke="rgba(124,58,237,0.25)" stroke-width="1.5">
    <animate attributeName="r" values="46;60;46" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- backend (top-left) -->
  <rect x="100" y="96" width="200" height="72" rx="12" fill="#161b22" stroke="#7c3aed" stroke-width="1.5" filter="url(#nodeGlow)"/>
  <rect x="100" y="96" width="200" height="72" rx="12" fill="rgba(124,58,237,0.06)"/>
  <text x="120" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#7c3aed" letter-spacing="1.5">AGENT</text>
  <text x="120" y="143" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700" fill="#e6edf3">backend</text>
  <text x="120" y="159" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6e7681">~/projects/backend</text>

  <!-- frontend (top-right) -->
  <rect x="600" y="96" width="200" height="72" rx="12" fill="#161b22" stroke="#0ea5e9" stroke-width="1.5" filter="url(#nodeGlow)"/>
  <rect x="600" y="96" width="200" height="72" rx="12" fill="rgba(14,165,233,0.06)"/>
  <text x="620" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#0ea5e9" letter-spacing="1.5">AGENT</text>
  <text x="620" y="143" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700" fill="#e6edf3">frontend</text>
  <text x="620" y="159" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6e7681">~/projects/frontend</text>

  <!-- fixer (bottom-left) -->
  <rect x="100" y="290" width="200" height="72" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5" filter="url(#nodeGlow)"/>
  <rect x="100" y="290" width="200" height="72" rx="12" fill="rgba(63,185,80,0.06)"/>
  <text x="120" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#3fb950" letter-spacing="1.5">AGENT</text>
  <text x="120" y="337" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700" fill="#e6edf3">fixer</text>
  <text x="120" y="353" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6e7681">~/projects/backend</text>

  <!-- orchestrator (bottom-right) -->
  <rect x="600" y="290" width="200" height="72" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="1.5" filter="url(#nodeGlow)"/>
  <rect x="600" y="290" width="200" height="72" rx="12" fill="rgba(240,136,62,0.06)"/>
  <text x="620" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#f0883e" letter-spacing="1.5">AGENT</text>
  <text x="620" y="337" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700" fill="#e6edf3">orchestrator</text>
  <text x="620" y="353" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6e7681">~/projects/main</text>

  <!-- Title -->
  <text x="450" y="48" text-anchor="middle" font-family="'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">Agent Synapse</text>
  <text x="450" y="72" text-anchor="middle" font-family="'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#6e7681" letter-spacing="0.6">Cross-project messaging for Claude Code sessions</text>

  <!-- Install bar -->
  <rect x="240" y="392" width="420" height="42" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="266" cy="413" r="5.5" fill="#ff5f56"/>
  <circle cx="285" cy="413" r="5.5" fill="#ffbd2e"/>
  <circle cx="304" cy="413" r="5.5" fill="#27c93f"/>
  <line x1="320" y1="392" x2="320" y2="434" stroke="#30363d" stroke-width="1"/>
  <text x="334" y="418" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#6e7681">$ </text>
  <text x="350" y="418" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#7ee787">npm install -g agent-synapse</text>
</svg>
